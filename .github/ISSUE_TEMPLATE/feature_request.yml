name: 🚀 Feature request
description: Suggest a change or an addition
title: "[FEAT] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the situation, not the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: impact
    attributes:
      label: This would touch
      options:
        - label: The API contract (the frontend needs a matching change)
        - label: The database schema (needs a migration)
        - label: Billing or plans
        - label: AI prompts or providers
