name: Security

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Mondays 06:00 UTC: catches vulnerabilities published after the last commit
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  codeql:
    name: 🛡️ CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: python
          queries: security-extended

      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:python

  scheduled-audit:
    name: 🔒 Scheduled Dependency Audit
    # Pull requests and pushes are already audited by the CI workflow
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pip-audit
        run: pip install "$(grep -E '^pip-audit==' requirements-dev.txt)"

      - name: Audit runtime dependencies
        run: pip-audit -r requirements.txt
