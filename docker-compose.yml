services:
  api:
    build:
      context: .
      args:
        INSTALL_DEV: "true"   # include pytest, ruff, pip-audit
    ports:
      - "8000:8000"
    volumes:
      - .:/app:z
    # Development: migrate, then run with auto-reload. Other settings come from the mounted .env
    command: sh -c "alembic upgrade head && uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/cvstudio
      - WATCHFILES_FORCE_POLLING=true
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=cvstudio
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cvstudio"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
